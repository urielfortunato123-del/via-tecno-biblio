services:
  - type: web
    name: fiscalizacao-rodoviaria-biblioteca
    runtime: node
    plan: standard
    # --include=dev garante que vite/nitro/typescript (devDependencies) sejam instalados
    # mesmo quando NODE_ENV=production no ambiente de build do Render.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: NITRO_PRESET
        value: node-server
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "22.22.0"
